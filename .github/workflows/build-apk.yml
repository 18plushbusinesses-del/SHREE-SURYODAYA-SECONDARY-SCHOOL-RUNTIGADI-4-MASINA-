name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p app/src/main/assets/public
          cp -r dist/* app/src/main/assets/public/
          cp -r public/* app/src/main/assets/public/ 2>/dev/null || true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Wrapper & Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x ./gradlew || true
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          ls -la app/build/outputs/apk/debug/
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/*.apk output_apk/Suryodaya-School-App.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSSS-debug-apk
          path: output_apk/Suryodaya-School-App.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" "output_apk/Suryodaya-School-App.apk" \
            --title "Suryodaya School App APK #${{ github.run_number }}" \
            --notes "Automated Android APK build for Shree Suryodaya Secondary School (Session 2083/2084 BS)." \
            --latest || true
